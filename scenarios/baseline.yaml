# Baseline 场景: 标准无冲击长跑.
#
# 用于:
# - 回归门禁 (确保任何重构后基线行为不漂移)
# - 性能预算 (n_ticks=1200 → 50 年月步)
# - 校准目标矩对照 (校准套件 golden trace)

name: baseline
description: |
  标准稳态长跑, 无外生冲击, 用于回归测试与性能基线.
  n_households=1000 (足够统计意义, 跑得快); n_ticks=1200 (50 年).

seed: 42
n_ticks: 1200
n_households: 1000

# 多部门经济 (PR-7 校准): 默认 sectors 只有 consumer_goods×1 家企业,
# 雇着全部家庭 — 一次现金流冲击即全员失业. 六部门分散主体风险.
sectors: [consumer_goods, capital, energy, housing_services, high_tech, services]

# 财政可持续 (PR-7 校准): G=0.45/τ=0.25 的结构性赤字 ≈ 25% 月度 GDP,
# 600 月债务冲到 6.4 倍年化 GDP. 0.40/0.35 → 债务稳定 ~1.8 倍年化,
# 稳态失业 ~6% (摩擦性), 通胀 ~0.6%, 零企业破产.
gov_spending_share_gdp: 0.40
income_tax_rate: 0.35
corp_tax_rate: 0.21

taylor_inflation_coeff: 1.5
taylor_output_coeff: 0.5
taylor_smoothing: 0.85

car_requirement: 0.08
car_buffer: 0.02
initial_bank_car: 0.12

enable_housing: true
enable_events: false
preset_shocks: []
