[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-sim"
version = "0.0.1"
description = "Agent-based macroeconomic simulation for education"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FinancialSim Contributors"}
]
keywords = ["agent-based", "macroeconomics", "simulation", "education", "ABM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "polars>=0.20,<1.0",
    "numpy>=1.25,<2.0",
    "numba>=0.58,<1.0",
    "scipy>=1.11,<2.0",
    "networkx>=3.2,<4.0",
    "pyarrow>=14,<16.0",
    "duckdb>=0.9,<2.0",
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-xdist>=3.5,<5.0",
    "ruff>=0.1,<1.0",
    "mypy>=1.7,<2.0",
    "types-PyYAML",
    "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/anomalyco/FinancialSim"
Documentation = "https://github.com/anomalyco/FinancialSim/blob/main/DESIGN.md"
Issues = "https://github.com/anomalyco/FinancialSim/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["financial_sim*"]
exclude = ["tests*", "docs*", "scenarios*", "reports*"]

[tool.setuptools.package-data]
"financial_sim" = ["py.typed"]

# ════════════════════════════════════════════════════════════
# Ruff 配置
# ════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["financial_sim", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "PT",    # pytest style
    "ERA",   # eradicate commented code
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (pydantic uses this)
    "SIM108", # ternary expressions
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "ERA001", "E741"]  # asserts, doc-comments, single-letter vars OK in tests
"**/__init__.py" = ["F401"]  # re-exports OK
"financial_sim/**/*.py" = ["ERA001", "E741"]  # Chinese inline comments OK in source

[tool.ruff.lint.isort]
known-first-party = ["financial_sim", "tests"]

# ════════════════════════════════════════════════════════════
# Mypy 配置
# ════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Phase 0 暂时宽松
ignore_missing_imports = true
exclude = ["tests/", "build/"]

# ════════════════════════════════════════════════════════════
# Pytest 配置
# ════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "-ra",  # show all summary info
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "calibration: 校准测试(慢)",
    "slow: 慢测试(默认跳过,用 --runslow 启用)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:numba",
    "ignore::DeprecationWarning:pandas",
]

# ════════════════════════════════════════════════════════════
# Coverage 配置
# ════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["financial_sim"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 1
